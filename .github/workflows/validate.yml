name: Repository checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      required_week:
        description: Require reports through semester week 10–17 (optional)
        required: false
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run validate
        env:
          REQUIRED_WEEK: ${{ inputs.required_week }}

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.8
      - run: uv sync --locked --python 3.12
      - run: uv run --locked python -c "import agentshield.cli, langgraph.graph, langchain_openai"
      - run: uv run --locked pytest
